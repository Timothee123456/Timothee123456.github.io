<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Révisions Physique-Chimie</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
      color: #333;
    }

    header {
      text-align: center;
      margin-bottom: 50px;
    }

    h1 {
      color: #fff;
      font-size: 2.8rem;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
      letter-spacing: 1px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .section {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .section h2 {
      font-size: 1.8rem;
      color: #4a3f8f;
      border-bottom: 3px solid #667eea;
      padding-bottom: 12px;
      margin-bottom: 22px;
    }

    ul {
      list-style: none;
    }

    li {
      margin-bottom: 14px;
    }

    li a {
      display: block;
      text-decoration: none;
      color: #333;
      background: #f4f5fb;
      padding: 16px 20px;
      border-radius: 10px;
      border-left: 5px solid #667eea;
      font-size: 1.1rem;
      transition: all 0.25s ease;
    }

    li a:hover {
      background: #667eea;
      color: #fff;
      transform: translateX(8px);
      box-shadow: 0 6px 18px rgba(102, 126, 234, 0.4);
    }

    footer {
      text-align: center;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 40px;
      font-size: 0.9rem;
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.9rem; }
      .section { padding: 20px; }
      .section h2 { font-size: 1.4rem; }
      li a { font-size: 1rem; padding: 14px 16px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Révisions Physique-Chimie</h1>
    </header>

    <section class="section">
      <h2>Chapitre 1</h2>
      <ul>
        <li>
          <a href="https://timothee123456.github.io/eval/pc/ch1" target="_blank" rel="noopener">
            Infos principales
          </a>
        </li>
        <li>
          <a href="https://timothee123456.github.io/eval/pc/ec" target="_blank" rel="noopener">
            Identification des Espèces Chimiques
          </a>
        </li>
        <li>
          <a href="https://timothee123456.github.io/eval/pc/ec2" target="_blank" rel="noopener">
            Identification des Espèces Chimiques (niveau difficile)
          </a>
        </li>
      </ul>
    </section>

    <section class="section">
      <h2>Chapitre 2</h2>
      <ul>
        <li>
          <a href="https://timothee123456.github.io/eval/pc/atome" target="_blank" rel="noopener">
            Atome
          </a>
        </li>
      </ul>
    </section>

    <footer>
      Bonnes révisions ! 📚
    </footer>
  </div>
</body>
</html>
