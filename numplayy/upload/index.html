<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting…</title>

  <!-- Method 1: Meta refresh (works without JavaScript) -->
  <meta http-equiv="refresh" content="0; url=https://timothee123456.github.io/numplay/upload">

  <link rel="canonical" href="https://timothee123456.github.io/numplay/upload">

  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f6f8;
      color: #333;
      text-align: center;
    }
    a { color: #0066cc; }
  </style>
</head>
<body>
  <div>
    <p>Redirecting you to <strong>numplay/upload</strong>…</p>
    <p><small>If nothing happens, <a href="https://timothee123456.github.io/numplay/upload" id="manual-link">click here</a>.</small></p>
  </div>

  <script>
    (function () {
      var target = "https://timothee123456.github.io/numplay/upload";
      window.location.replace(target);
    })();
  </script>

  <noscript>
    <p>JavaScript is disabled — the redirect will still happen automatically.</p>
  </noscript>
</body>
</html>
