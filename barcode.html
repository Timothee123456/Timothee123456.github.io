<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mobile Barcode & QR Scanner</title>
  <!-- html5-qrcode library for reliable cross-browser mobile camera scanning -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-light: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }

    header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    header p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .scanner-card {
      background: var(--surface);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      margin-bottom: 16px;
    }

    #reader {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }

    #reader video {
      border-radius: 12px;
      object-fit: cover;
    }

    /* Camera & Zoom Controls */
    .camera-settings {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
      background: var(--bg);
      padding: 10px 12px;
      border-radius: 10px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.85rem;
    }

    .setting-row label {
      color: var(--text-muted);
      white-space: nowrap;
      font-weight: 500;
    }

    select {
      flex: 1;
      background: var(--surface-light);
      color: var(--text);
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.85rem;
      outline: none;
      max-width: 100%;
    }

    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .zoom-badge {
      background: var(--surface-light);
      padding: 4px 8px;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8rem;
      min-width: 46px;
      text-align: center;
    }

    .zoom-presets {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .preset-btn {
      background: var(--surface-light);
      color: var(--text);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .preset-btn.active {
      background: var(--primary);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-success {
      background: var(--success);
      grid-column: span 2;
      font-size: 1rem;
      padding: 14px;
    }

    .btn-danger {
      background: var(--danger);
    }

    .btn-secondary {
      background: var(--surface-light);
    }

    .options-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--surface-light);
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .options-bar label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .status-toast {
      text-align: center;
      font-size: 0.85rem;
      min-height: 20px;
      margin-bottom: 10px;
      color: var(--success);
      font-weight: 500;
    }

    .list-card {
      background: var(--surface);
      border-radius: 16px;
      padding: 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .list-header h2 {
      font-size: 1rem;
      font-weight: 600;
    }

    .badge {
      background: var(--primary);
      color: white;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .scanned-list {
      list-style: none;
      max-height: 260px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .scanned-item {
      background: var(--bg);
      padding: 10px 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.9rem;
      word-break: break-all;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .delete-item {
      background: transparent;
      color: var(--text-muted);
      padding: 4px 8px;
      font-size: 1rem;
      margin-left: 8px;
    }

    .delete-item:hover {
      color: var(--danger);
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 24px 0;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header>
    <h1>Barcode & QR Batch Scanner</h1>
    <p>Scan continuously and export all codes to a .txt file</p>
  </header>

  <div class="status-toast" id="statusToast">Ready to scan</div>

  <div class="scanner-card">
    <div id="reader"></div>

    <!-- Lens Selector & Optical/Digital Zoom Controls -->
    <div class="camera-settings hidden" id="cameraSettings">
      <div class="setting-row" id="cameraSelectRow">
        <label for="cameraSelect">Lens:</label>
        <select id="cameraSelect"></select>
      </div>

      <div class="setting-row hidden" id="zoomRow">
        <label for="zoomSlider">Zoom:</label>
        <div class="zoom-controls">
          <input type="range" id="zoomSlider" min="1" max="5" step="0.1" value="1" />
          <span class="zoom-badge" id="zoomValue">1.0x</span>
        </div>
      </div>

      <div class="zoom-presets hidden" id="zoomPresets"></div>
    </div>

    <div class="controls">
      <button id="startBtn" class="btn-primary">Start Camera</button>
      <button id="stopBtn" class="btn-secondary" disabled>Stop Camera</button>
      <button id="downloadBtn" class="btn-success" disabled>Download .TXT (0)</button>
    </div>

    <div class="options-bar">
      <label>
        <input type="checkbox" id="allowDuplicates" />
        Allow duplicate scans
      </label>
      <button id="clearBtn" class="btn-danger" style="padding: 6px 10px; font-size: 0.8rem;" disabled>Clear All</button>
    </div>
  </div>

  <div class="list-card">
    <div class="list-header">
      <h2>Scanned Codes</h2>
      <span class="badge" id="countBadge">0</span>
    </div>
    <ul class="scanned-list" id="scannedList">
      <li class="empty-state" id="emptyState">No barcodes scanned yet. Tap "Start Camera" to begin.</li>
    </ul>
  </div>

  <script>
    const scannedCodes = [];
    let html5QrCode = null;
    let isScanning = false;
    let lastScannedText = "";
    let lastScanTime = 0;
    let availableCameras = [];
    let currentCameraId = null;

    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const clearBtn = document.getElementById("clearBtn");
    const allowDuplicatesCheckbox = document.getElementById("allowDuplicates");
    const scannedList = document.getElementById("scannedList");
    const emptyState = document.getElementById("emptyState");
    const countBadge = document.getElementById("countBadge");
    const statusToast = document.getElementById("statusToast");

    const cameraSettings = document.getElementById("cameraSettings");
    const cameraSelectRow = document.getElementById("cameraSelectRow");
    const cameraSelect = document.getElementById("cameraSelect");
    const zoomRow = document.getElementById("zoomRow");
    const zoomSlider = document.getElementById("zoomSlider");
    const zoomValue = document.getElementById("zoomValue");
    const zoomPresets = document.getElementById("zoomPresets");

    function playBeep() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.1);
      } catch (e) {}
    }

    function showToast(message, isWarning = false) {
      statusToast.textContent = message;
      statusToast.style.color = isWarning ? "#f59e0b" : "#10b981";
    }

    function updateUI() {
      countBadge.textContent = scannedCodes.length;
      downloadBtn.textContent = `Download .TXT (${scannedCodes.length})`;
      downloadBtn.disabled = scannedCodes.length === 0;
      clearBtn.disabled = scannedCodes.length === 0;

      scannedList.innerHTML = "";
      if (scannedCodes.length === 0) {
        scannedList.appendChild(emptyState);
        return;
      }

      [...scannedCodes].reverse().forEach((code, revIndex) => {
        const originalIndex = scannedCodes.length - 1 - revIndex;
        const li = document.createElement("li");
        li.className = "scanned-item";

        const span = document.createElement("span");
        span.textContent = `${originalIndex + 1}. ${code}`;

        const delBtn = document.createElement("button");
        delBtn.className = "delete-item";
        delBtn.innerHTML = "&times;";
        delBtn.title = "Remove";
        delBtn.onclick = () => {
          scannedCodes.splice(originalIndex, 1);
          updateUI();
        };

        li.appendChild(span);
        li.appendChild(delBtn);
        scannedList.appendChild(li);
      });
    }

    function onScanSuccess(decodedText) {
      const now = Date.now();
      if (decodedText === lastScannedText && now - lastScanTime < 1500) {
        return;
      }
      lastScannedText = decodedText;
      lastScanTime = now;

      const allowDuplicates = allowDuplicatesCheckbox.checked;
      if (!allowDuplicates && scannedCodes.includes(decodedText)) {
        showToast(`Duplicate skipped: ${decodedText}`, true);
        return;
      }

      scannedCodes.push(decodedText);
      playBeep();
      if (navigator.vibrate) navigator.vibrate(100);
      showToast(`Scanned: ${decodedText}`);
      updateUI();
    }

    // Pick the standard 1x rear camera by default (avoiding ultra-wide 0.5x or macro lenses when labeled)
    function selectDefault1xCamera(cameras) {
      if (!cameras || cameras.length === 0) return null;

      // Filter for rear/back cameras first
      const backCameras = cameras.filter(c =>
        /back|rear|environment/i.test(c.label) && !/front|user|selfie/i.test(c.label)
      );

      const pool = backCameras.length > 0 ? backCameras : cameras;

      // Look for an explicit main/standard 1x lens (excluding ultra-wide, wide 0.5x, telephoto, macro, depth)
      const standardMain = pool.find(c =>
        !/ultra|0\.5|0\.6|macro|tele|zoom|depth|tof/i.test(c.label)
      );

      if (standardMain) return standardMain.id;

      // On Android Chrome, camera 0 is typically the primary 1x rear sensor
      return pool[0].id;
    }

    async function populateCameraDropdown() {
      try {
        availableCameras = await Html5Qrcode.getCameras();
        if (!availableCameras || availableCameras.length === 0) return;

        cameraSelect.innerHTML = "";
        availableCameras.forEach((cam, idx) => {
          const opt = document.createElement("option");
          opt.value = cam.id;
          opt.textContent = cam.label || `Camera ${idx + 1}`;
          cameraSelect.appendChild(opt);
        });

        cameraSettings.classList.remove("hidden");
        // Show lens dropdown whenever multiple cameras exist
        if (availableCameras.length > 1) {
          cameraSelectRow.classList.remove("hidden");
        } else {
          cameraSelectRow.classList.add("hidden");
        }
      } catch (e) {
        console.warn("Could not enumerate cameras:", e);
      }
    }

    // Configure hardware/optical zoom if supported by the active camera track, defaulting to 1.0x
    async function setupHardwareZoom() {
      zoomRow.classList.add("hidden");
      zoomPresets.classList.add("hidden");
      zoomPresets.innerHTML = "";

      try {
        const videoElem = document.querySelector("#reader video");
        if (!videoElem || !videoElem.srcObject) return;

        const track = videoElem.srcObject.getVideoTracks()[0];
        if (!track || typeof track.getCapabilities !== "function") return;

        const capabilities = track.getCapabilities();
        if (!capabilities.zoom) return;

        const minZoom = capabilities.zoom.min || 1;
        const maxZoom = Math.min(capabilities.zoom.max || 1, 10); // cap slider at 10x for usability
        const step = capabilities.zoom.step || 0.1;

        if (maxZoom <= minZoom) return;

        // Default to 1.0x (clamped to camera's supported range)
        const defaultZoom = Math.min(Math.max(1.0, minZoom), maxZoom);

        zoomSlider.min = minZoom;
        zoomSlider.max = maxZoom;
        zoomSlider.step = step;
        zoomSlider.value = defaultZoom;
        zoomValue.textContent = `${defaultZoom.toFixed(1)}x`;

        await applyZoom(defaultZoom);

        zoomRow.classList.remove("hidden");

        // Build quick-tap preset buttons (e.g., 0.5x, 1x, 2x, 3x) within supported bounds
        const candidatePresets = [0.5, 1.0, 2.0, 3.0, 5.0].filter(
          z => z >= minZoom && z <= maxZoom
        );

        if (candidatePresets.length > 1) {
          candidatePresets.forEach(z => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "preset-btn" + (Math.abs(z - defaultZoom) < 0.05 ? " active" : "");
            btn.textContent = `${z % 1 === 0 ? z.toFixed(0) : z.toFixed(1)}x`;
            btn.onclick = () => {
              zoomSlider.value = z;
              applyZoom(z);
            };
            zoomPresets.appendChild(btn);
          });
          zoomPresets.classList.remove("hidden");
        }
      } catch (e) {
        console.warn("Zoom capabilities unavailable:", e);
      }
    }

    async function applyZoom(zoomLevel) {
      const val = parseFloat(zoomLevel);
      zoomValue.textContent = `${val.toFixed(1)}x`;

      // Highlight matching preset button
      document.querySelectorAll(".preset-btn").forEach(btn => {
        const btnVal = parseFloat(btn.textContent);
        btn.classList.toggle("active", Math.abs(btnVal - val) < 0.05);
      });

      try {
        const videoElem = document.querySelector("#reader video");
        if (!videoElem || !videoElem.srcObject) return;
        const track = videoElem.srcObject.getVideoTracks()[0];
        if (track && typeof track.applyConstraints === "function") {
          await track.applyConstraints({ advanced: [{ zoom: val }] });
        }
      } catch (e) {
        console.warn("Failed to apply zoom:", e);
      }
    }

    zoomSlider.addEventListener("input", (e) => {
      applyZoom(e.target.value);
    });

    async function startScannerWithCamera(cameraId = null) {
      if (isScanning && html5QrCode) {
        await html5QrCode.stop();
        html5QrCode.clear();
        isScanning = false;
      }

      html5QrCode = new Html5Qrcode("reader");
      const config = {
        fps: 10,
        qrbox: { width: 250, height: 180 },
        aspectRatio: 1.333334
      };

      const cameraConfig = cameraId
        ? { deviceId: { exact: cameraId } }
        : { facingMode: "environment" };

      await html5QrCode.start(cameraConfig, config, onScanSuccess);
      isScanning = true;
      startBtn.disabled = true;
      stopBtn.disabled = false;

      // Sync dropdown with the active track's deviceId
      const videoElem = document.querySelector("#reader video");
      if (videoElem && videoElem.srcObject) {
        const activeTrack = videoElem.srcObject.getVideoTracks()[0];
        const activeId = activeTrack?.getSettings()?.deviceId;
        if (activeId) {
          currentCameraId = activeId;
          cameraSelect.value = activeId;
        }
      }

      // Initialize zoom at 1x
      await setupHardwareZoom();
      showToast("Camera active (1.0x) — point at a barcode or QR code");
    }

    startBtn.addEventListener("click", async () => {
      if (isScanning) return;

      try {
        // Populate camera list first (if permissions were already granted, labels are visible immediately)
        await populateCameraDropdown();

        let targetId = cameraSelect.value || selectDefault1xCamera(availableCameras);
        await startScannerWithCamera(targetId);

        // Re-populate after stream starts in case browser hid camera labels prior to permission grant
        const hadEmptyLabels = availableCameras.some(c => !c.label);
        if (hadEmptyLabels) {
          await populateCameraDropdown();
          const best1xId = selectDefault1xCamera(availableCameras);
          if (best1xId && best1xId !== currentCameraId) {
            await startScannerWithCamera(best1xId);
          } else if (currentCameraId) {
            cameraSelect.value = currentCameraId;
          }
        }
      } catch (err) {
        showToast("Camera error: Ensure HTTPS & camera permissions are enabled.", true);
        console.error(err);
      }
    });

    // Switch physical lens when user selects another camera from the dropdown
    cameraSelect.addEventListener("change", async (e) => {
      const selectedId = e.target.value;
      if (!selectedId || !isScanning) return;

      try {
        showToast("Switching camera lens...");
        await startScannerWithCamera(selectedId);
      } catch (err) {
        showToast("Could not switch to selected camera.", true);
        console.error(err);
      }
    });

    stopBtn.addEventListener("click", async () => {
      if (!isScanning || !html5QrCode) return;
      try {
        await html5QrCode.stop();
        html5QrCode.clear();
        isScanning = false;
        startBtn.disabled = false;
        stopBtn.disabled = true;
        zoomRow.classList.add("hidden");
        zoomPresets.classList.add("hidden");
        showToast("Camera stopped");
      } catch (err) {
        console.error(err);
      }
    });

    downloadBtn.addEventListener("click", () => {
      if (scannedCodes.length === 0) return;

      const fileContent = scannedCodes.join("\n");
      const blob = new Blob([fileContent], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      const timestamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
      a.href = url;
      a.download = `scanned-barcodes-${timestamp}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      showToast(`Exported ${scannedCodes.length} code(s) to .txt`);
    });

    clearBtn.addEventListener("click", () => {
      if (confirm("Clear all scanned barcodes?")) {
        scannedCodes.length = 0;
        lastScannedText = "";
        updateUI();
        showToast("List cleared");
      }
    });
  </script>
</body>
</html>
